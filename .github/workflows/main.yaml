name: mneme

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      # very_good_cli 1.1.1 (installed by the reusable workflow) needs
      # Dart ^3.11, which Flutter 3.35 (Dart 3.9) cannot provide. This
      # tracks the validated developer SDK; keep pubspec and lockfile
      # installable by it.
      flutter_version: "3.47.x"
      # es_compression resolves its native blob via ZSTD_LIBRARY_PATH.
      # Package-relative lookup does not work under flutter test, so
      # locate the pub-cache blob (version-agnostic) for the test step.
      setup: >
        echo "ZSTD_LIBRARY_PATH=$(dirname $(find ~/.pub-cache -name
        'eszstd-linux64.so' -print -quit))" >> "$GITHUB_ENV"
  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1
    with:
      includes: |
        **/*.md
        **/*.dart
        **/*.yaml
        **/*.yml
      modified_files_only: false

  # Test-builds the production APK on every PR so Gradle, Kotlin, R8 and
  # signing-config breakage gates the PR instead of the release tag. Uses
  # an ephemeral debug keystore and never publishes.
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: ⚡ Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 📦 Install Dependencies
        run: flutter pub get
      - name: 🔑 Ephemeral debug keystore
        run: |
          keytool -genkeypair \
            -keystore /tmp/mneme-debug.keystore -alias mneme-debug \
            -keyalg RSA -keysize 2048 -validity 90 \
            -storepass mneme-debug -keypass mneme-debug \
            -dname 'CN=Mneme ephemeral debug, OU=dev, O=mneme-verse'

      - name: 🏗️ Build production APK
        env:
          ANDROID_KEYSTORE_PATH: /tmp/mneme-debug.keystore
          ANDROID_KEYSTORE_ALIAS: mneme-debug
          ANDROID_KEYSTORE_PASSWORD: mneme-debug
          ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: mneme-debug
        run: |
          set +e
          # The Flutter Gradle plugin force-enables R8 for release builds
          # (shouldShrinkResources defaults true); opt out until shrinking
          # proves itself in this gate without blocking releases.
          flutter build apk --release --flavor production -t lib/main_production.dart --target-platform android-arm64 --android-project-arg=shrink=false > /tmp/apk.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            detail=$(grep -A10 'What went wrong' /tmp/apk.log | head -n 25 | tr '\n' '|')
            missing=$(grep -e 'Missing class' -e 'Missing definitions' /tmp/apk.log | sort -u | head -n 10 | tr '\n' '|')
            echo "::error::apk build failed: $(grep -e 'FAILURE' -e 'error:' -e 'Exception' -e 'FAILED' /tmp/apk.log | head -n 5 | tr '\n' '|') detail: $detail missing: $missing"
            tail -n 40 /tmp/apk.log
            exit $code
          fi
          ls -la build/app/outputs/flutter-apk/
