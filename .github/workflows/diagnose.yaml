# TEMPORARY diagnostic: runs the suite the way CI does, failing loudly,
# because Actions log downloads are unavailable from this environment.
# DELETE BEFORE MERGE.
name: diagnose-tests

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🧪 Run tests exactly like CI
        run: |
          export ZSTD_LIBRARY_PATH="$(dirname "$(find ~/.pub-cache -name 'eszstd-linux64.so' -print -quit)")"
          echo "ZSTD_LIBRARY_PATH=$ZSTD_LIBRARY_PATH"
          test -n "$ZSTD_LIBRARY_PATH" || { echo 'BLOB NOT FOUND' >&2; exit 10; }
          flutter test --coverage --test-randomize-ordering-seed random
