# Experiment: cross-compile transcribe.cpp for Android arm64.
#
# Proves the Dart-FFI engine route before any app code depends on it:
# builds libtranscribe.so with the NDK Flutter itself pins and uploads it
# as an artifact. Manual dispatch only; never publishes.
name: transcribe-android

on:
  workflow_dispatch:

jobs:
  arm64-lib:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install NDK and CMake
        run: |
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-24" 2>&1 | tail -n 2
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: 🏗️ Configure arm64 shared lib
        run: |
          set +e
          cmake -S third_party/transcribe.cpp -B /tmp/transcribe-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DTRANSCRIBE_BUILD_SHARED=ON \
            -DTRANSCRIBE_BUILD_TESTS=OFF \
            -DTRANSCRIBE_BUILD_EXAMPLES=OFF \
            -DTRANSCRIBE_BUILD_TOOLS=OFF \
            > /tmp/transcribe-cmake.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::cmake configure failed: $(grep -e 'Error' -e 'error:' /tmp/transcribe-cmake.log | head -n 5 | tr '\n' '|')"
            tail -n 30 /tmp/transcribe-cmake.log
            exit $code
          fi
          grep -e 'transcribe version' -e 'Build type' /tmp/transcribe-cmake.log | head -n 4
          echo CONFIGURED

      - name: 🔨 Build libtranscribe
        run: |
          set +e
          cmake --build /tmp/transcribe-android -j "$(nproc)" > /tmp/transcribe-build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::native build failed: $(grep -e 'error:' -e 'Error [0-9]' /tmp/transcribe-build.log | head -n 5 | tr '\n' '|')"
            tail -n 30 /tmp/transcribe-build.log
            exit $code
          fi
          find /tmp/transcribe-android -name 'libtranscribe.so' | head -n 3

      - name: 📤 Upload arm64 libs
        uses: actions/upload-artifact@v7
        with:
          name: libtranscribe-arm64
          path: /tmp/transcribe-android/**/lib*.so*
          if-no-files-found: error

  linux-lib:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 🏗️ Configure Linux shared lib
        run: |
          set +e
          cmake -S third_party/transcribe.cpp -B /tmp/transcribe-linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DTRANSCRIBE_BUILD_SHARED=ON \
            -DTRANSCRIBE_BUILD_TESTS=OFF \
            -DTRANSCRIBE_BUILD_EXAMPLES=OFF \
            -DTRANSCRIBE_BUILD_TOOLS=OFF > /tmp/transcribe-linux-cmake.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::cmake configure failed: $(grep -e 'Error' -e 'error:' /tmp/transcribe-linux-cmake.log | head -n 5 | tr '\n' '|')"
            tail -n 30 /tmp/transcribe-linux-cmake.log
            exit $code
          fi
          echo CONFIGURED

      - name: 🔨 Build Linux libtranscribe
        run: |
          set +e
          cmake --build /tmp/transcribe-linux -j "$(nproc)" > /tmp/transcribe-linux-build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::native build failed: $(grep -e 'error:' -e 'Error [0-9]' /tmp/transcribe-linux-build.log | head -n 5 | tr '\n' '|')"
            tail -n 30 /tmp/transcribe-linux-build.log
            exit $code
          fi
          find /tmp/transcribe-linux -name 'libtranscribe.so' | head -n 3

      - name: 📤 Upload Linux lib
        uses: actions/upload-artifact@v7
        with:
          name: libtranscribe-linux64
          path: /tmp/transcribe-linux/**/libtranscribe.so
          if-no-files-found: error
