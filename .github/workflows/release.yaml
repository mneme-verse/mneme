# Release publication.
#
# App: pushing a tag `v*` builds a production arm64 APK and attaches it
# (plus its SHA-256) to the GitHub Release for that tag. App release tags
# (`v*`) and corpus data tags (`data-v*`) stay separate.
#
# Signing: while no stable release keystore exists, the APK is signed with
# an ephemeral debug key generated inside the run. Such artifacts are for
# sideload testing only: they carry no stable update identity and must
# never be presented as the production release. To cut a stable release,
# set these repository secrets (Settings > Secrets > Actions) and retag:
# - ANDROID_KEYSTORE_BASE64: base64 of the stable release keystore. Never
#   commit the keystore or regenerate it casually: Android treats a new
#   certificate as a different app identity.
# - ANDROID_KEYSTORE_ALIAS
# - ANDROID_KEYSTORE_PASSWORD
# - ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD
#
# Corpus data: run this workflow manually with a language to build its
# `.db.zst` pack (tool/builder.dart) and publish it to the `data-v*`
# release (tool/publish_data.dart). No signing secrets are needed.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      corpus_language:
        description: 'Build and publish one corpus pack (empty skips data)'
        required: false
        default: ''
        type: choice
        options: ['', cs, de, en, hu, no, pt, ru, sl]

permissions:
  contents: write

jobs:
  apk:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: ⚡ Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔑 Keystore (stable secret or ephemeral debug)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          SECRET_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            echo "KEYSTORE_PATH=${{ github.workspace }}/android/app/release.keystore" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SECRET_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_STORE_PASS=$SECRET_STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_KEY_PASS=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
            echo "APK_LABEL=signed" >> "$GITHUB_ENV"
          else
            keytool -genkeypair \
              -keystore /tmp/mneme-debug.keystore -alias mneme-debug \
              -keyalg RSA -keysize 2048 -validity 90 \
              -storepass mneme-debug -keypass mneme-debug \
              -dname 'CN=Mneme ephemeral debug, OU=dev, O=mneme-verse'
            echo "KEYSTORE_PATH=/tmp/mneme-debug.keystore" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=mneme-debug" >> "$GITHUB_ENV"
            echo "KEY_STORE_PASS=mneme-debug" >> "$GITHUB_ENV"
            echo "KEY_KEY_PASS=mneme-debug" >> "$GITHUB_ENV"
            echo "APK_LABEL=debug-signed" >> "$GITHUB_ENV"
          fi

      - name: 🏗️ Build production APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEYSTORE_ALIAS: ${{ env.KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.KEY_STORE_PASS }}
          ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: ${{ env.KEY_KEY_PASS }}
        run: |
          set +e
          flutter build apk --release --flavor production -t lib/main_production.dart --target-platform android-arm64 --android-project-arg=shrink=false > /tmp/apk.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            detail=$(grep -A10 'What went wrong' /tmp/apk.log | head -n 25 | tr '\n' '|')
            missing=$(grep -e 'Missing class' -e 'Missing definitions' /tmp/apk.log | sort -u | head -n 10 | tr '\n' '|')
            echo "::error::apk build failed: $(grep -e 'FAILURE' -e 'error:' -e 'Exception' -e 'FAILED' /tmp/apk.log | head -n 5 | tr '\n' '|') detail: $detail missing: $missing"
            tail -n 40 /tmp/apk.log
            exit $code
          fi
          ls -la build/app/outputs/flutter-apk/
      - name: 🚀 Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          src=build/app/outputs/flutter-apk/app-production-release.apk
          out="mneme-${GITHUB_REF_NAME}-production-${APK_LABEL}.apk"
          cp "$src" "$out"
          sha256sum "$out" | tee "$out.sha256"
          if [ "$APK_LABEL" = "debug-signed" ]; then
            notes='Sideload testing only: ephemeral debug signature, no stable update identity. Not the production release.'
            prerelease='--prerelease'
          else
            notes='Production release APK with SHA-256 checksum.'
            prerelease=''
          fi
          # shellcheck disable=SC2086
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes" $prerelease
          gh release upload "$GITHUB_REF_NAME" "$out" "$out.sha256" --clobber

  corpus-data:
    if: inputs.corpus_language != ''
    runs-on: ubuntu-latest
    # Read-modify-upload on one shared manifest: concurrent language
    # publishes would clobber each other, so dispatches queue here.
    concurrency:
      group: corpus-data-publish
      cancel-in-progress: false
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🌳 Build corpus pack
        run: |
          set +e
          dart run tool/builder.dart --languages=${{ inputs.corpus_language }} --clean-after=poetree,db > /tmp/builder.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::builder failed: $(grep -e '❌' -e 'Error' -e 'Exception' /tmp/builder.log | head -n 4 | tr '\n' '|')"
            tail -n 30 /tmp/builder.log
            exit $code
          fi
          count=$(ls assets/database/*.db.zst 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::builder produced no packs: $(grep -e '❌' -e 'Downloaded' -e 'download' /tmp/builder.log | head -n 6 | tr '\n' '|')"
            tail -n 30 /tmp/builder.log
            exit 1
          fi
          ls assets/database/
      - name: 📤 Publish data release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          dart run tool/publish_data.dart > /tmp/publish.log 2>&1
          code=$?
          tail -n 25 /tmp/publish.log
          if [ $code -ne 0 ]; then
            echo "::error::publish failed: $(tail -n 4 /tmp/publish.log | tr '\n' '|')"
            exit $code
          fi
